version: "3.8"

services:
  auto-analyst:
    build: .
    container_name: auto-analyst-ai
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://localhost:8000
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 900M
          cpus: "0.9"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
