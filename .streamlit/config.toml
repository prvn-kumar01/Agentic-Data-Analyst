[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0d17"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 500
maxMessageSize = 500
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
